<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: lucide "venetian-mask" icon (MIT/ISC, matches in-app branding) —
         avoids a 404 for a missing static icon file since this project has no
         /public asset folder. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%230d0d0d'/><g fill='none' stroke='%2322c55e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M18 11c-1.5 0-2.5.5-3 2'/><path d='M4 6a2 2 0 0 0-2 2v4a5 5 0 0 0 5 5 8 8 0 0 1 5 2 8 8 0 0 1 5-2 5 5 0 0 0 5-5V8a2 2 0 0 0-2-2h-3a8 8 0 0 0-5 2 8 8 0 0 0-5-2z'/><path d='M6 11c1.5 0 2.5.5 3 2'/></g></svg>" />

    <!-- Mobile-first viewport: cover fills notch/punch-hole areas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Prevent iOS double-tap zoom -->
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA / home-screen meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Imposter" />

    <!-- Browser chrome colour (Android + Safari 15+) -->
    <meta name="theme-color" content="#0d0d0d" />

    <title>Imposter In Person</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        /* Remove blue tap highlight on Android/iOS */
        -webkit-tap-highlight-color: transparent;
      }

      html {
        /* Prevent iOS Safari font-size boosting when device rotates */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        line-height: 1.5;
        color: white;
        background: #0d0d0d;
        /* Prevent elastic over-scroll bounce revealing white behind the app */
        overscroll-behavior: none;
      }

      input,
      select,
      button,
      textarea {
        font-family: inherit;
        /* Prevent iOS from zooming into inputs: keep font-size ≥ 16px */
        font-size: 16px;
        /* Remove 300ms tap delay everywhere */
        touch-action: manipulation;
      }

      /* Allow momentum scrolling in scrollable areas on iOS */
      .scroll-area {
        -webkit-overflow-scrolling: touch;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
