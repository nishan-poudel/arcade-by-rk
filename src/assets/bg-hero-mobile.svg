<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridMobile" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0V80" stroke="#1a1a1a" stroke-width=".5"/>
      <path d="M0 80H80" stroke="#1a1a1a" stroke-width=".5"/>
    </pattern>
  </defs>
  <rect width="1080" height="1920" fill="#0d0d0d"/>
  <rect width="1080" height="1920" fill="url(#gridMobile)" opacity=".1"/>
  <g fill="none" stroke="#fff" stroke-width=".5" opacity=".08">
    <rect x="260" y="320" width="30" height="30"/>
    <rect x="720" y="260" width="24" height="24"/>
    <rect x="340" y="780" width="26" height="26"/>
    <rect x="680" y="1040" width="22" height="22"/>
    <rect x="420" y="1380" width="28" height="28"/>
  </g>
  <g fill="#fefce8" opacity=".2">
    <circle cx="290" cy="360" r="2"/>
    <circle cx="740" cy="290" r="1.5"/>
    <circle cx="370" cy="820" r="2"/>
    <circle cx="710" cy="1080" r="1.5"/>
    <circle cx="450" cy="1420" r="2"/>
    <circle cx="820" cy="640" r="1.5"/>
    <circle cx="260" cy="1120" r="1.5"/>
  </g>
  <line x1="540" y1="160" x2="540" y2="1760" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" filter="url(#glow)" opacity=".15"/>
</svg>
