<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: a simple spade glyph in the "juicy soda" coral accent,
         matching the branding pattern used by the Imposter app's inline
         data-URI favicon (this project also has no /public asset folder). -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23241f2b'/><path fill='%23f0705a' d='M12 3c-2.5 3-6 5.5-6 9a4.5 4.5 0 0 0 6.5 4c-.3 1.4-1 2.5-2 3.3h3 3c-1-.8-1.7-1.9-2-3.3A4.5 4.5 0 0 0 21 12c0-3.5-3.5-6-9-9z'/></svg>" />

    <!-- Mobile-first viewport: cover fills notch/punch-hole areas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Prevent iOS double-tap zoom -->
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA / home-screen meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Call Break" />

    <!-- Browser chrome colour (Android + Safari 15+) — matches the canvas
         token in src/assets/tailwind.css for each theme. -->
    <meta name="theme-color" content="#fbf6ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#241f2b" media="(prefers-color-scheme: dark)" />

    <!--
      Pre-paint theme init: applies the saved/system light-dark preference to
      <html> before Vue mounts, so there's no flash of the wrong theme. Kept
      in sync with src/composables/useTheme.ts (same storage key + fallback).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('callbreak-theme')
          var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>

    <title>Call Break</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        /* Remove blue tap highlight on Android/iOS */
        -webkit-tap-highlight-color: transparent;
      }

      html {
        /* Prevent iOS Safari font-size boosting when device rotates */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      /* Pre-CSS-load fallback background, matching the two theme canvases
         (src/assets/tailwind.css --background). The `dark` class is already
         set synchronously by the script above, before this paints. */
      html:not(.dark) body {
        color: #241f2b;
        background: #fbf6ea;
      }
      html.dark body {
        color: #f3ede0;
        background: #241f2b;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        line-height: 1.5;
        /* Prevent elastic over-scroll bounce revealing a mismatched color behind the app */
        overscroll-behavior: none;
      }

      input,
      select,
      button,
      textarea {
        font-family: inherit;
        /* Prevent iOS from zooming into inputs: keep font-size ≥ 16px */
        font-size: 16px;
        /* Remove 300ms tap delay everywhere */
        touch-action: manipulation;
      }

      /* Allow momentum scrolling in scrollable areas on iOS */
      .scroll-area {
        -webkit-overflow-scrolling: touch;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
